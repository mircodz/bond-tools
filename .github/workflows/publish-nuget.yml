name: Release

on:
  workflow_dispatch:

permissions:
  contents: write   # to push the release tag and create the GitHub release
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    name: check branch and version
    if: github.actor == 'mircodz'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Ensure main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are published from main; this run is on ${GITHUB_REF}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$version'. Expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "Tag $version already exists. Bump the version file." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  publish:
    name: publish, tag and release
    needs: [check, build]
    environment: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      OUT_DIR: out/package/release
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.OUT_DIR }}

      - name: Verify packages
        run: |
          for package in bond-tools BondTools.Parser BondTools.Runtime BondTools.Build; do
            test -f "$OUT_DIR/$package.$VERSION.nupkg"
          done
          dotnet tool install --tool-path out/tool --add-source "$OUT_DIR" bond-tools --version "$VERSION"
          test "$(out/tool/bond --version)" = "$VERSION"

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          server: https://api.nuget.org/v3/index.json
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate \
            --no-symbols

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      # Notes list the pull requests merged since the previous tag, which isn't always a GitHub release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous="$(git tag --list | grep -vx "$VERSION" | sort -V | tail -n1)"
          gh release create "$VERSION" "$OUT_DIR"/*.nupkg \
            --verify-tag \
            --title "bond-tools $VERSION" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
