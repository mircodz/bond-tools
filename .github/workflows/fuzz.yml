name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      first:
        description: First seed
        required: false
      schemas:
        description: Schemas per shard
        required: false
        default: '6250'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build
      run: dotnet build tests/Bond.Parser.Tests --configuration Release

    - name: Fuzz
      env:
        BOND_FUZZ_PROFILE: large
        FIRST: ${{ inputs.first }}
        SCHEMAS: ${{ inputs.schemas || '6250' }}
        RUN: ${{ github.run_number }}
        SHARD: ${{ matrix.shard }}
        CHUNK: 500
      run: |
        start=$(( ${FIRST:-$(( RUN * 8 * SCHEMAS ))} + SHARD * SCHEMAS ))
        end=$(( start + SCHEMAS ))
        echo "Seeds $start to $(( end - 1 ))" >> "$GITHUB_STEP_SUMMARY"
        status=0
        for (( seed = start; seed < end; seed += CHUNK )); do
          count=$(( end - seed < CHUNK ? end - seed : CHUNK ))
          log="fuzz-$seed.log"
          if ! BOND_FUZZ_SEED=$seed BOND_FUZZ_SCHEMAS=$count dotnet test --project tests/Bond.Parser.Tests \
              --configuration Release --no-build --filter-class Bond.Parser.Tests.SchemaFuzzTests > "$log" 2>&1; then
            status=1
            summary=$(sed -n '/failures:$/,/The first of each kind/p' "$log" | head -40)
            {
              echo "### Seeds $seed to $(( seed + count - 1 ))"
              echo '```'
              echo "${summary:-$(tail -40 "$log")}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        exit $status

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.shard }}
        path: fuzz-*.log
        retention-days: 14
